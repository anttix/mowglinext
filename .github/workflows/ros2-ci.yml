name: ROS2 — CI

on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**', 'refactor/**', 'chore/**', 'perf/**']
    paths:
      - 'ros2/**'
      - 'tools/motor/**'
      - 'install/config/mowgli/**'
      - '.github/workflows/ros2-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ros2/**'
      - 'tools/motor/**'
      - 'install/config/mowgli/**'
      - '.github/workflows/ros2-ci.yml'

concurrency:
  group: ros2-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ROS_DISTRO: lyrical

jobs:
  # ─── Config Drift Gate ───────────────────────────────────────────────────────
  # Guards Architecture Invariant 15: the installed mowgli_robot.yaml is SPARSE
  # over the in-package template. check_config_drift.py fails if a STRUCTURAL
  # field (chassis geometry, wheel kinematics, sensor mounts) is defined in both
  # files with divergent values, or added to the installed file with no template
  # default — either of which silently gives Nav2/URDF/coverage the wrong
  # chassis. It also fails (issue #381) if the committed sparse file pads a key
  # with a value EQUAL to its template default — a no-op at merge time that
  # silently pins robots to a stale value when the template default is later
  # changed. No ROS2 setup needed; runs in seconds as a hard gate.
  config-drift:
    name: Config Drift (mowgli_robot.yaml)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check mowgli_robot.yaml drift + padded defaults
        run: |
          python3 -m pip install --quiet pyyaml
          python3 ros2/scripts/check_config_drift.py

      - name: Unit-test check_config_drift.py
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -q ros2/scripts/test_check_config_drift.py

  # ─── Build & Test ────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (ROS2 ${{ matrix.ros_distro }})
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: lyrical
            ubuntu: "26.04"

    defaults:
      run:
        working-directory: ros2

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # opennav_coverage is a git submodule providing opennav_coverage_msgs
          # (a source package in the workspace). Without it checked out, rosdep
          # can't see it as a source dep and `rosdep install --ignore-src`
          # fails with "Cannot locate rosdep definition for
          # [opennav_coverage_msgs]", blocking the build+test. (ros2-docker.yml
          # already checks out submodules; this CI didn't — so tests never ran.)
          submodules: recursive

      - name: Link sidecar ROS2 tools package into workspace
        working-directory: ros2
        run: |
          mkdir -p src
          rm -rf src/mowgli_tools
          ln -s ../../tools/motor src/mowgli_tools
          ls -la src
          ls -la src/mowgli_tools
          test -f src/mowgli_tools/package.xml

      - name: Preinstall ROS apt source package
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # setup-ros currently synthesizes the GitHub release asset filename
          # for ros2-apt-source. Preinstall the package from the release
          # metadata instead so CI follows the published asset URL directly.
          bash .github/scripts/install-ros-apt-source.sh ros2-apt-source

      - name: Setup ROS2 ${{ matrix.ros_distro }}
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distro }}

      - name: Initialize source underlay
        id: underlay
        working-directory: .
        run: |
          echo "MOWGLI_UNDERLAY=${RUNNER_TEMP}/mowgli-underlay" >> "$GITHUB_ENV"
          echo "path=${RUNNER_TEMP}/mowgli-underlay" >> "$GITHUB_OUTPUT"

      - name: Cache Nav2
        id: cache-nav2
        uses: actions/cache@v5
        with:
          path: ${{ steps.underlay.outputs.path }}/nav2
          key: nav2-${{ matrix.ubuntu }}-${{ hashFiles('ros2/scripts/build_nav2.sh') }}

      - name: Build Nav2
        if: steps.cache-nav2.outputs.cache-hit != 'true'
        run: |
          NAV2_PREFIX="${MOWGLI_UNDERLAY}/nav2" \
          NAV2_JOBS=2 \
            scripts/build_nav2.sh

      - name: Install cached Nav2 dependencies
        if: steps.cache-nav2.outputs.cache-hit == 'true'
        run: |
          NAV2_DEPS_ONLY=1 scripts/build_nav2.sh

      - name: Validate mowgli_tools package discovery
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon list --base-paths src | tee /tmp/colcon-list.txt
          grep -E '^mowgli_tools\s' /tmp/colcon-list.txt

      - name: Cache GTSAM build
        id: cache-gtsam
        uses: actions/cache@v5
        with:
          path: ${{ steps.underlay.outputs.path }}/gtsam
          key: gtsam-4.3a1-${{ matrix.ubuntu }}-v3

      - name: Build GTSAM 4.3a1 from source
        working-directory: .
        if: steps.cache-gtsam.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git \
            libboost-all-dev libeigen3-dev libmetis-dev
          cd /tmp
          git clone --depth 1 -b 4.3a1 https://github.com/borglab/gtsam.git
          cd gtsam && mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${MOWGLI_UNDERLAY}/gtsam" \
            -DGTSAM_BUILD_TESTS=OFF \
            -DGTSAM_BUILD_EXAMPLES_ALWAYS=OFF \
            -DGTSAM_BUILD_PYTHON=OFF \
            -DGTSAM_BUILD_UNSTABLE=OFF \
            -DGTSAM_USE_SYSTEM_EIGEN=ON \
            -DGTSAM_USE_SYSTEM_METIS=ON \
            -DGTSAM_WITH_TBB=OFF \
            -DGTSAM_WITH_EIGEN_MKL=OFF \
            -DGTSAM_INSTALL_MATLAB_TOOLBOX=OFF \
            -DCMAKE_CXX_FLAGS=-Wno-error=array-bounds \
            -DBUILD_SHARED_LIBS=ON
          make -j2 install

      - name: Install GTSAM runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libboost-all-dev libeigen3-dev libmetis-dev

      - name: Cache OR-Tools vendor
        id: cache-ortools
        uses: actions/cache@v5
        with:
          path: ${{ steps.underlay.outputs.path }}/ortools_vendor
          key: ortools-vendor-${{ matrix.ubuntu }}-${{ hashFiles('ros2/scripts/build_ortools_vendor.sh') }}

      - name: Build OR-Tools vendor
        if: steps.cache-ortools.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ros-${{ matrix.ros_distro }}-ament-cmake-vendor-package
          ORTOOLS_VENDOR_PREFIX="${MOWGLI_UNDERLAY}/ortools_vendor" \
          ORTOOLS_VENDOR_JOBS=2 \
            scripts/build_ortools_vendor.sh

      - name: Cache Fields2Cover build
        id: cache-f2c
        uses: actions/cache@v5
        with:
          path: /opt/fields2cover-300
          key: f2c-3.0.0-884d895-${{ matrix.ubuntu }}-v4

      - name: Build Fields2Cover v3 from source
        working-directory: .
        if: steps.cache-f2c.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git pkg-config \
            libeigen3-dev libgdal-dev libgeos++-dev libgeos-dev libgsl-dev \
            libtinyxml2-dev libpython3-dev python3-dev libtbb-dev nlohmann-json3-dev
          set +u
          source "${MOWGLI_UNDERLAY}/ortools_vendor/setup.bash"
          set -u
          cd /tmp
          git clone https://github.com/Fields2Cover/Fields2Cover.git f2c3
          cd f2c3 && git checkout 884d895b59192882476e986ba44ea9143a06a6a9
          sed -i '1i #include <iomanip>' src/fields2cover/utils/visualizer.cpp
          sed -i '1i #include <algorithm>' src/fields2cover/types/Graph.cpp
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/fields2cover-300 \
            -DBUILD_TESTS=OFF \
            -DBUILD_PYTHON=OFF \
            -DBUILD_TUTORIALS=OFF \
            -DBUILD_DOC=OFF \
            -DALLOW_PARALLELIZATION=ON \
            -DBUILD_SHARED_LIBS=ON
          make -j2
          sudo make install

      - name: Install Fields2Cover runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev libgeos-dev libgeos++-dev libtinyxml2-dev
          echo "/opt/fields2cover-300/lib" | sudo tee /etc/ld.so.conf.d/f2c.conf
          sudo ldconfig

      - name: Cache grid_map
        id: cache-grid-map
        uses: actions/cache@v5
        with:
          path: ${{ steps.underlay.outputs.path }}/grid_map
          key: grid-map-${{ matrix.ubuntu }}-${{ hashFiles('ros2/patches/grid_map-lyrical.patch') }}

      - name: Build grid_map
        if: steps.cache-grid-map.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/ANYbotics/grid_map.git \
            /tmp/grid-map-ws/src/grid_map
          git -C /tmp/grid-map-ws/src/grid_map checkout \
            7ae24725d7effa0c22a23524b91b46bada5b2728
          git -C /tmp/grid-map-ws/src/grid_map apply \
            "$GITHUB_WORKSPACE/ros2/patches/grid_map-lyrical.patch"
          set +u
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          source "${MOWGLI_UNDERLAY}/nav2/setup.bash"
          set -u
          rosdep install \
            --from-paths \
              /tmp/grid-map-ws/src/grid_map/grid_map_cmake_helpers \
              /tmp/grid-map-ws/src/grid_map/grid_map_msgs \
              /tmp/grid-map-ws/src/grid_map/grid_map_core \
              /tmp/grid-map-ws/src/grid_map/grid_map_cv \
              /tmp/grid-map-ws/src/grid_map/grid_map_ros \
            --ignore-src \
            --rosdistro ${{ matrix.ros_distro }} \
            --skip-keys nav2_msgs \
            -y
          cd /tmp/grid-map-ws
          colcon build \
            --merge-install \
            --install-base "${MOWGLI_UNDERLAY}/grid_map" \
            --packages-select \
              grid_map_cmake_helpers grid_map_msgs grid_map_core \
              grid_map_cv grid_map_ros \
            --parallel-workers 2 \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=OFF \
              -DCMAKE_CXX_FLAGS="-Wno-deprecated-declarations -Wno-error=array-bounds"

      - name: Cache Webots ROS2
        id: cache-webots-ros2
        uses: actions/cache@v5
        with:
          path: ${{ steps.underlay.outputs.path }}/webots_ros2
          key: webots-ros2-${{ matrix.ubuntu }}-${{ hashFiles('ros2/patches/webots_ros2-lyrical.patch') }}

      - name: Build Webots ROS2
        if: steps.cache-webots-ros2.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/cyberbotics/webots_ros2.git \
            /tmp/webots-ws/src/webots_ros2
          git -C /tmp/webots-ws/src/webots_ros2 checkout \
            a5a9c3f82b0056809e89c976b9e9f45137c0fd57
          git -C /tmp/webots-ws/src/webots_ros2 submodule update --init --recursive
          git -C /tmp/webots-ws/src/webots_ros2 apply \
            "$GITHUB_WORKSPACE/ros2/patches/webots_ros2-lyrical.patch"
          set +u
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          set -u
          rosdep install \
            --from-paths \
              /tmp/webots-ws/src/webots_ros2/webots_ros2_msgs \
              /tmp/webots-ws/src/webots_ros2/webots_ros2_importer \
              /tmp/webots-ws/src/webots_ros2/webots_ros2_driver \
              /tmp/webots-ws/src/webots_ros2/webots_ros2_control \
            --ignore-src \
            --rosdistro ${{ matrix.ros_distro }} \
            -y
          cd /tmp/webots-ws
          colcon build \
            --merge-install \
            --install-base "${MOWGLI_UNDERLAY}/webots_ros2" \
            --packages-up-to webots_ros2_driver webots_ros2_control \
            --parallel-workers 2 \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Register source underlay
        working-directory: .
        run: |
          cat > "${RUNNER_TEMP}/mowgli_underlay.sh" <<EOF
          set +u
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          source "${MOWGLI_UNDERLAY}/nav2/setup.bash"
          source "${MOWGLI_UNDERLAY}/ortools_vendor/setup.bash"
          source "${MOWGLI_UNDERLAY}/grid_map/setup.bash"
          source "${MOWGLI_UNDERLAY}/webots_ros2/setup.bash"
          set -u
          export CMAKE_PREFIX_PATH="/opt/fields2cover-300:${MOWGLI_UNDERLAY}/gtsam:\${CMAKE_PREFIX_PATH:-}"
          export LD_LIBRARY_PATH="/opt/fields2cover-300/lib:${MOWGLI_UNDERLAY}/gtsam/lib:\${LD_LIBRARY_PATH:-}"
          EOF
          echo "MOWGLI_UNDERLAY_SETUP=${RUNNER_TEMP}/mowgli_underlay.sh" >> "$GITHUB_ENV"

      - name: Cache rosdep
        uses: actions/cache@v4
        with:
          path: ~/.ros/rosdep
          key: rosdep-${{ matrix.ros_distro }}-${{ hashFiles('ros2/src/**/package.xml', 'tools/motor/package.xml') }}
          restore-keys: |
            rosdep-${{ matrix.ros_distro }}-

      # Only opennav_coverage_msgs (the action types) is used from the
      # opennav_coverage submodule; the upstream server subpackages are pinned
      # to F2C 1.2.1 and must NOT be built (they #include fields2cover.h from
      # the v1 install). The Docker image drops the same COLCON_IGNORE markers
      # (Dockerfile stage); mirror that here or opennav_coverage fails the build.
      - name: COLCON_IGNORE upstream opennav_coverage subpackages
        run: |
          for p in opennav_coverage opennav_coverage_bt opennav_coverage_demo \
                   opennav_coverage_navigator opennav_row_coverage; do
            touch "src/opennav_coverage/$p/COLCON_IGNORE" 2>/dev/null || true
          done

      - name: Install rosdep dependencies
        run: |
          source "${MOWGLI_UNDERLAY_SETUP}"
          sudo apt-get update
          rosdep update --rosdistro ${{ matrix.ros_distro }}
          rosdep install \
            --from-paths src \
            --ignore-src \
            --rosdistro ${{ matrix.ros_distro }} \
            --skip-keys \
              "grid_map_core grid_map_msgs grid_map_ros nav2_behaviors nav2_bringup nav2_bt_navigator nav2_controller nav2_core nav2_costmap_2d nav2_lifecycle_manager nav2_map_server nav2_mppi_controller nav2_msgs nav2_planner nav2_regulated_pure_pursuit_controller nav2_ros_common nav2_smac_planner nav2_util nav2_waypoint_follower opennav_coverage opennav_coverage_bt opennav_coverage_demo opennav_coverage_navigator opennav_docking opennav_row_coverage ortools_vendor webots_ros2_driver" \
            -y

      - name: Cache colcon workspace
        uses: actions/cache@v4
        with:
          path: |
            ros2/build
            ros2/install
            ros2/log
          key: colcon-v2-${{ matrix.ros_distro }}-${{ hashFiles('ros2/src/**/CMakeLists.txt', 'ros2/src/**/package.xml', 'ros2/src/**/*.cpp', 'ros2/src/**/*.hpp', 'tools/motor/**') }}
          restore-keys: |
            colcon-v2-${{ matrix.ros_distro }}-

      - name: Build workspace
        run: |
          source "${MOWGLI_UNDERLAY_SETUP}"
          colcon build \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PROJECT_INCLUDE_BEFORE="${GITHUB_WORKSPACE}/ros2/cmake/ament_target_dependencies_compat.cmake" \
            --parallel-workers $(nproc) \
            --event-handlers console_cohesion+

      - name: Run tests
        run: |
          source "${MOWGLI_UNDERLAY_SETUP}"
          set +u
          source install/setup.bash
          set -u
          colcon test \
            --return-code-on-test-failure \
            --event-handlers console_cohesion+
          colcon test-result --verbose

      - name: Validate mowgli_tools package entrypoint
        run: |
          source "${MOWGLI_UNDERLAY_SETUP}"
          set +u
          source install/setup.bash
          set -u
          ros2 pkg prefix mowgli_tools
          ros2 run mowgli_tools tune_drive_pid --help | tee /tmp/mowgli_tools_help.txt
          grep -q "Controlled drive PID tuning" /tmp/mowgli_tools_help.txt

      - name: Validate external GNSS launch contract
        working-directory: .
        run: |
          source "${MOWGLI_UNDERLAY_SETUP}"
          set +u
          source "${GITHUB_WORKSPACE}/ros2/install/setup.bash"
          set -u
          ros2 launch mowgli_bringup full_system.launch.py --show-args \
            | tee /tmp/full_system_show_args.txt
          ! grep -q "use_universal_gnss" /tmp/full_system_show_args.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.ros_distro }}
          path: |
            ros2/build/**/test_results/**/*.xml
            ros2/log/latest_test/**
          retention-days: 14

  # ─── Formatting Check ────────────────────────────────────────────────────────
  format-check:
    name: Formatting (clang-format)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install clang-format + git-clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format

      # Check only the LINES CHANGED versus the merge-base with dev, not the
      # whole tree. The legacy tree is not fully clang-format-clean, so a
      # whole-tree --Werror check is permanently red and useless as a gate;
      # git-clang-format diffs only the touched lines, so this passes when the
      # current change is clean and flags only NEW violations.
      - name: Check formatting (changed lines)
        run: |
          git fetch --no-tags --depth=200 origin dev || git fetch --no-tags origin dev || true
          BASE=$(git merge-base origin/dev HEAD 2>/dev/null || true)
          if [ -z "$BASE" ]; then
            echo "No merge-base with origin/dev — skipping."
            exit 0
          fi
          DIFF=$(git-clang-format-18 --binary clang-format-18 \
                   --style=file:ros2/.clang-format --diff "$BASE" -- \
                   ros2/src 2>/dev/null || true)
          case "$DIFF" in
            ""|"no modified files to format"|"clang-format did not modify any files")
              echo "Changed lines are correctly formatted." ;;
            *)
              echo "$DIFF"
              echo "::error::Changed lines are not clang-format clean (run 'make format' / git clang-format)."
              exit 1 ;;
          esac

  # ─── Static Analysis ─────────────────────────────────────────────────────────
  static-analysis:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      # Report-only on the CHANGED files versus main. The legacy tree carries
      # cppcheck findings we haven't triaged, so this is informational
      # (continue-on-error) and scoped to what the current change touched —
      # surfaces new findings in the log/artifact without permanently
      # red-gating the workflow. Tighten to a hard gate once the legacy
      # findings are cleared.
      - name: Run cppcheck (changed files, report-only)
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=200 origin dev || git fetch --no-tags origin dev || true
          BASE=$(git merge-base origin/dev HEAD 2>/dev/null || true)
          if [ -n "$BASE" ]; then
            FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- 'ros2/src/' \
              | grep -E '\.(cpp|hpp)$' | grep -v '/test/' | grep -v '/opennav_coverage/' || true)
          else
            FILES=$(find ros2/src/ \( -name "*.cpp" -o -name "*.hpp" \) \
              -not -path "*/test/*" -not -path "*/opennav_coverage/*")
          fi
          if [ -z "$FILES" ]; then
            echo "No changed C++ files — skipping."
            exit 0
          fi
          echo "cppcheck on changed files:"; echo "$FILES"
          # Common cppcheck flags. --inline-suppr lets us silence narrow false
          # positives at the call-site with `// cppcheck-suppress <id>` comments
          # rather than maintaining a global suppress list.
          # Global suppressions for known false positives that aren't worth
          # an inline annotation:
          #   - useInitializationList: ROS2 nodes commonly assign members
          #     (callback groups, QoS, paths read from declare_parameter) in
          #     the body because those calls require the rclcpp::Node
          #     constructor to have run first.
          CPPCHECK_FLAGS=(
            --enable=warning,performance,portability
            --inline-suppr
            --suppress=missingInclude
            --suppress=unmatchedSuppression
            --suppress=useInitializationList
            --suppress=normalCheckLevelMaxBranches
            --error-exitcode=1
          )
          echo "$FILES" | xargs cppcheck "${CPPCHECK_FLAGS[@]}" --xml 2>cppcheck-report.xml
          echo "$FILES" | xargs cppcheck "${CPPCHECK_FLAGS[@]}" --quiet

      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cppcheck-report
          path: cppcheck-report.xml
          if-no-files-found: ignore
          retention-days: 7
